[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kelebek-sinav-sistemi"
version = "0.10.0"
description = "Çevrimdışı yerel sınav organizasyonu uygulaması"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "certifi",
  "cryptography>=42",
  "Flask>=3.0,<4",
  "openpyxl>=3.1,<4",
  "ortools>=9.10,<10",
  "pdfplumber>=0.11.10,<0.12",
  "reportlab>=4,<5",
  "SQLAlchemy>=2.0,<3",
  "waitress>=3,<4",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

# Kural kümesi burada sabitlenir; ruff sürümü değiştiğinde sonuçlar kaymaz.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "B008",    # Flask/SQLAlchemy kalıplarında çağrı varsayılanları yaygın
  "RUF001",  # Türkçe metinlerde benzer görünen Unicode karakter uyarısı
  "RUF002",
  "RUF003",
  "SIM108",  # üçlü ifade her zaman daha okunur değil
]

[tool.ruff.lint.isort]
known-first-party = ["kelebek"]

[tool.ruff.lint.per-file-ignores]
# Testlerde kasıtlı kalıplar (uzun kurgu verisi, iç işlevlere erişim) serbest.
"backend/tests/*" = ["E501"]
"tests/*" = ["E501"]
