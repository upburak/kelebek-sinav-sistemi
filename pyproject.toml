[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kelebek-sinav-sistemi"
version = "0.2.0"
description = "Çevrimdışı yerel sınav organizasyonu uygulaması"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "cryptography>=42",
  "Flask>=3.0,<4",
  "openpyxl>=3.1,<4",
  "ortools>=9.10,<10",
  "pdfplumber>=0.11.10,<0.12",
  "reportlab>=4,<5",
  "SQLAlchemy>=2.0,<3",
  "waitress>=3,<4",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"
