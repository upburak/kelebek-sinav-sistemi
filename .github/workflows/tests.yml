name: Testler

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Sunucu testleri (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Bağımlılıkları Kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "ruff==0.14.1"

      - name: Lint (ruff)
        run: ruff check backend scripts packaging tests

      - name: Birim Testleri
        shell: bash
        env:
          PYTHONPATH: backend
          PYTHONUTF8: '1'
        run: python -m unittest discover -s backend/tests -v

  frontend:
    name: Arayüz derlemesi
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bağımlılıkları Kur
        run: npm --prefix frontend ci

      - name: TypeScript Derlemesi
        run: npm --prefix frontend run build

  e2e:
    name: Uçtan uca API testleri
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bağımlılıkları Kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest requests playwright
          python -m playwright install --with-deps chromium
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Uçtan Uca Testler
        env:
          PYTHONPATH: backend
        run: python -m pytest tests/e2e -q
