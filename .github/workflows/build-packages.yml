name: Paketleri Oluştur

on:
  workflow_dispatch:
  # main'e her birleştirmede paketler kendiliğinden üretilir ve yayımlanır.
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']

concurrency:
  group: paketler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: macOS Paketini Derle
    runs-on: macos-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: macOS Kurulumu ve Derleme
        run: |
          chmod +x ./scripts/setup-macos.sh ./scripts/build-macos.sh
          ./scripts/setup-macos.sh
          ./scripts/build-macos.sh

      - name: macOS Duman Testi
        run: .venv/bin/python packaging/smoke_test.py

      - name: macOS Artifact Yükle
        uses: actions/upload-artifact@v4
        with:
          name: kelebek-macOS
          path: |
            dist/*.dmg
            dist/*.sha256

  build-windows:
    name: Windows Paketini Derle
    runs-on: windows-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Inno Setup Kur (yoksa)
        shell: pwsh
        continue-on-error: true
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Windows Derleme
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          .\scripts\build-windows.ps1

      - name: Windows Duman Testi
        shell: pwsh
        run: .\.venv\Scripts\python.exe packaging\smoke_test.py

      - name: Windows Artifact Yükle
        uses: actions/upload-artifact@v4
        with:
          name: kelebek-Windows
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt

  release:
    name: GitHub Sürümünü Yayımla
    needs: [build-macos, build-windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Paketleri İndir
        uses: actions/download-artifact@v4
        with:
          path: paketler
          merge-multiple: true

      - name: Sürümü Oluştur veya Güncelle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' backend/kelebek/version.py)
          TAG="v$VERSION"
          ls -la paketler
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" paketler/* --clobber
          else
            gh release create "$TAG" paketler/* --target "$GITHUB_SHA" \
              --title "Kelebek Sınav Sistemi $VERSION" \
              --notes "macOS (Apple Silicon): .dmg dosyasını indirin. Windows: -kurulum.exe dosyasını (yoksa .zip) indirin. Ayrıntılar için CHANGELOG.md."
          fi
