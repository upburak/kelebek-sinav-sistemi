name: Paketleri Oluştur

on:
  workflow_dispatch:

jobs:
  build-macos:
    name: macOS Paketini Derle
    runs-on: macos-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: macOS Kurulumu ve Derleme
        run: |
          chmod +x ./scripts/setup-macos.sh ./scripts/build-macos.sh
          ./scripts/setup-macos.sh
          ./scripts/build-macos.sh

      - name: macOS Artifact Yükle
        uses: actions/upload-artifact@v4
        with:
          name: kelebek-macOS
          path: dist/*.dmg

  build-windows:
    name: Windows Paketini Derle
    runs-on: windows-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Windows Derleme
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          .\scripts\build-windows.ps1

      - name: Windows Artifact Yükle
        uses: actions/upload-artifact@v4
        with:
          name: kelebek-Windows
          path: dist/*
